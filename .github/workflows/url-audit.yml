name: URL Audit

on:
  schedule:
    # Weekly, Mondays at 10:00 UTC.
    - cron: "0 10 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  audit-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://khosravipooya.com/EyeDataHub/

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install Python package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run URL audit
        run: |
          python -m hub.audit.verify_urls \
            --out hub/audit/url_report.json \
            --md hub/audit/url_report.md

      - name: Write job summary
        run: |
          {
            echo "## EyeDataHub URL Audit"
            echo
            cat hub/audit/url_report.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload URL audit reports
        uses: actions/upload-artifact@v7
        with:
          name: url-audit-report
          path: |
            hub/audit/url_report.json
            hub/audit/url_report.md

      - name: Regenerate Docusaurus docs with latest audit
        run: |
          python -m hub.docs.generate_dataset_pages --out website/docs
          python -m hub.audit.write_docusaurus_report

      - name: Install website dependencies
        working-directory: website
        run: npm ci

      - name: Build Docusaurus site
        working-directory: website
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Delete stale Pages artifacts from this run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
            --paginate \
            --jq '.artifacts[] | select(.name == "github-pages") | .id' |
          while read -r artifact_id; do
            if [ -n "$artifact_id" ]; then
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
            fi
          done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/build

      - name: Deploy to GitHub Pages (attempt 1)
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Wait before Pages deployment retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 30

      - name: Deploy to GitHub Pages (retry)
        if: steps.deployment.outcome == 'failure'
        id: deployment_retry
        uses: actions/deploy-pages@v5
