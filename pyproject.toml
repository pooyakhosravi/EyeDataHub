[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eyedatahub"
version = "0.5.0"
description = "Versioned, source-term-aware command-line access tool for ophthalmology datasets."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "Pooya Khosravi", email = "pooya32kh@gmail.com"},
]
keywords = [
    "ophthalmology",
    "medical imaging",
    "datasets",
    "dataset catalog",
    "data acquisition",
    "reproducibility",
    "licensing",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "click>=8.0",
    "Pillow>=9.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "rich>=13.0",
    "tqdm>=4.65",
    "requests>=2.31",
    "gdown>=4.7",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
kaggle = ["kaggle>=1.5"]
huggingface = ["huggingface_hub>=0.19"]
synapse = ["synapseclient>=4.0"]
full = ["kaggle>=1.5", "huggingface_hub>=0.19", "synapseclient>=4.0"]

[project.scripts]
eyehub = "eyedatahub.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["eyedatahub*"]

[project.urls]
Homepage = "https://github.com/pooyakhosravi/EyeDataHub"
Documentation = "https://khosravipooya.com/EyeDataHub/"
Repository = "https://github.com/pooyakhosravi/EyeDataHub"
Issues = "https://github.com/pooyakhosravi/EyeDataHub/issues"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["."]
